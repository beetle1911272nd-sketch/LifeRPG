<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="refresh" content="2.2;url=/" />
    <title>ABORE LIFE RPG</title>
    <style>
      :root {
        --silver: #f4f4f1;
        --motion-duration: 2s;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
      }

      .launch-stage {
        position: relative;
        width: min(100vw, 56.25vh);
        height: min(177.7778vw, 100vh);
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }

      .logo {
        position: absolute;
        width: 78%;
        aspect-ratio: 1;
        left: 11%;
        top: 31%;
        object-fit: cover;
        transform: translateZ(0) scale(1);
        filter: contrast(1.03);
        animation: settle var(--motion-duration) cubic-bezier(.16,.84,.24,1) both;
      }

      .logo-quiet {
        opacity: 0;
        animation: quiet-in var(--motion-duration) ease-out both;
      }

      .logo-abore,
      .logo-subtitle {
        opacity: 0;
        clip-path: inset(0 0 0 0);
      }

      .logo-aura {
        z-index: -1;
        filter: grayscale(1) brightness(1.7) blur(7px);
        mix-blend-mode: screen;
        transform: translateZ(0) scale(1.008);
      }

      .aura-abore {
        clip-path: inset(38% 6% 35% 6%);
        animation: aura-abore-in var(--motion-duration) cubic-bezier(.16,.84,.24,1) both;
      }

      .aura-subtitle {
        clip-path: inset(60% 6% 25% 6%);
        animation: aura-subtitle-in var(--motion-duration) cubic-bezier(.16,.84,.24,1) both;
      }

      .logo-abore {
        animation: abore-in var(--motion-duration) cubic-bezier(.16,.84,.24,1) both;
      }

      .logo-subtitle {
        animation: subtitle-in var(--motion-duration) cubic-bezier(.16,.84,.24,1) both;
      }

      /*
       * The source artwork is square. These masks isolate the two typography
       * bands without adding glow, particles, or other game-like effects.
       */
      .logo-abore {
        clip-path: inset(38% 6% 35% 6%);
      }

      .logo-subtitle {
        clip-path: inset(60% 6% 25% 6%);
      }

      @keyframes quiet-in {
        0%, 15% { opacity: 0; }
        24% { opacity: .16; }
        100% { opacity: .16; }
      }

      @keyframes abore-in {
        0%, 14% { opacity: 0; transform: scale(.992); }
        29% { opacity: 0; }
        51% { opacity: 1; transform: scale(1); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes subtitle-in {
        0%, 43% { opacity: 0; transform: translateY(5px); }
        63% { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes aura-abore-in {
        0%, 14% { opacity: 0; transform: translateZ(0) scale(1.014); }
        29% { opacity: 0; }
        51% { opacity: .13; transform: translateZ(0) scale(1.008); }
        100% { opacity: .09; transform: translateZ(0) scale(1.008); }
      }

      @keyframes aura-subtitle-in {
        0%, 43% { opacity: 0; transform: translateZ(0) scale(1.012) translateY(5px); }
        63% { opacity: .10; transform: translateZ(0) scale(1.006) translateY(0); }
        100% { opacity: .07; transform: translateZ(0) scale(1.006) translateY(0); }
      }

      @keyframes settle {
        0% { transform: translateZ(0) scale(.985); }
        18% { transform: translateZ(0) scale(1); }
        100% { transform: translateZ(0) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo, .logo-quiet, .logo-abore, .logo-subtitle, .logo-aura {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }

      .continue {
        position: absolute;
        right: 0;
        bottom: 2.5%;
        left: 0;
        color: #8d8d89;
        font: 11px/1 Georgia, "Times New Roman", serif;
        letter-spacing: .16em;
        text-align: center;
        text-decoration: none;
        opacity: 0;
        animation: continue-in var(--motion-duration) ease-out 1.8s forwards;
      }

      @keyframes continue-in {
        to { opacity: .72; }
      }
    </style>
  </head>
  <body>
    <main class="launch-stage" aria-label="ABORE LIFE RPG 起動モーション">
      <img class="logo logo-quiet" src="/abore-launch-logo.jpeg" alt="" />
      <img class="logo logo-aura aura-abore" src="/abore-launch-logo.jpeg" alt="" />
      <img class="logo logo-aura aura-subtitle" src="/abore-launch-logo.jpeg" alt="" />
      <img class="logo logo-abore" src="/abore-launch-logo.jpeg" alt="ABORE" />
      <img class="logo logo-subtitle" src="/abore-launch-logo.jpeg" alt="LIFE RPG" />
      <a class="continue" href="/" aria-label="アプリを開く">TAP TO ENTER</a>
    </main>
    <script>
      const openApp = () => {
        window.location.href = "/";
      };

      window.setTimeout(openApp, 2050);
      document.querySelector(".launch-stage").addEventListener("click", openApp);
    </script>
  </body>
</html>
