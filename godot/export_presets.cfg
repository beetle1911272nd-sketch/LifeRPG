html/head_include="<link rel='icon' type='image/png' href='index.512x512.png'/><script>document.documentElement.lang='ja';</script><style>#status{background:radial-gradient(ellipse at 50% 40%,#1b2943 0%,#0d1224 72%);color:#f7f2e6}#status-splash{display:none!important}#status-progress{bottom:12%;width:min(72%,320px);height:8px;accent-color:#d7b96e}#status-notice{background:#182238;border-color:#806b40;color:#f7f2e6}.abore-loading-brand{display:flex;flex-direction:column;align-items:center;gap:16px;animation:abore-appear .55s ease-out both}.abore-loading-brand img{width:clamp(104px,24vw,160px);height:auto;filter:drop-shadow(0 8px 24px #0008)}.abore-loading-title{font:600 18px/1.3 system-ui,sans-serif;letter-spacing:.2em;color:#e8d49f}.abore-loading-caption{font:14px/1.4 system-ui,sans-serif;color:#b9c1d0}@keyframes abore-appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.abore-loading-brand{animation:none}}</style><script>(function(){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addBrand,{once:true});else addBrand();function addBrand(){const status=document.getElementById('status');if(!status)return;const brand=document.createElement('div');brand.className='abore-loading-brand';const emblem=document.createElement('img');emblem.src='index.512x512.png';emblem.alt='';const title=document.createElement('strong');title.className='abore-loading-title';title.textContent='ABORE LIFE RPG';const caption=document.createElement('span');caption.className='abore-loading-caption';caption.textContent='世界を読み込んでいます…';brand.append(emblem,title,caption);status.insertBefore(brand,status.firstChild);}})();</script><script>(function(){if(!('serviceWorker' in navigator))return;const hadController=Boolean(navigator.serviceWorker.controller);navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)window.location.reload();},{once:true});navigator.serviceWorker.register('index.service.worker.js',{updateViaCache:'none'}).then(async registration=>{registration.addEventListener('updatefound',()=>{const worker=registration.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)worker.postMessage('claim');});});await registration.update();if(registration.waiting)registration.waiting.postMessage('claim');}).catch(error=>console.error('PWA service worker registration failed:',error));})();</script>"
